<!DOCTYPE html>

<html lang="en">
<head>
<!-- Piece set: cburnett by Colin M. L. Burnett (via Lichess), open license -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chessii</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#090d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chessii">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090d12; --panel:#10161d; --panel2:#161e27;
  --accent:#33cc4d; --accent-ink:#04140a;
  --good:#33cc4d; --bad:#e0645c;
  --text:#eef3f7; --muted:#8b97a3; --border:#1e2833; color-scheme:dark;
  --light-sq:#eee6d0; --dark-sq:#5c7a4e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{
  background:var(--bg); color:var(--text); font-family:'Outfit',system-ui,-apple-system,sans-serif;
  display:flex; flex-direction:column; overflow-x:hidden;
}
button,input{font-family:inherit; color:inherit;}
h2{font-size:1.3rem; font-weight:700; margin:4px 0 14px;}
.muted{color:var(--muted);}
.hidden{display:none !important;}

.topbar{
  position:sticky; top:0; z-index:5; padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;
  background:var(--bg); border-bottom:1px solid var(--border);
}
.brand{font-weight:800; font-size:1.15rem; letter-spacing:.2px;}
.brand b{color:var(--accent);}

#app{flex:1; width:100%; max-width:480px; margin:0 auto; padding:18px 16px 110px;}

.hero{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.avatar{width:52px; height:52px; border-radius:16px; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:1.5rem; border:1px solid var(--border);}
.uname{font-weight:700; font-size:1.05rem;}
.ulevel{color:var(--accent); font-size:.85rem; font-weight:600;}

.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;}
.stat-card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:12px 8px; text-align:center;}
.stat-num{font-size:1.3rem; font-weight:800;}
.stat-lbl{font-size:.72rem; color:var(--muted); margin-top:2px;}

.cta{width:100%; padding:15px; border:none; border-radius:14px; background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:1.02rem; cursor:pointer; margin-bottom:22px;}
.cta:active{opacity:.85;}

.recent-title{font-weight:700; margin-bottom:8px; font-size:.95rem;}
.recent-list{display:flex; flex-direction:column; gap:6px;}
.recent-item{display:flex; justify-content:space-between; padding:10px 12px; border-radius:10px; background:var(--panel); border-left:3px solid var(--border); font-size:.88rem;}
.recent-item.w{border-left-color:var(--good);}
.recent-item.l{border-left-color:var(--bad);}
.recent-item.d{border-left-color:var(--muted);}

.mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;}
.mode-card{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:22px 8px; text-align:center; font-size:1rem; font-weight:600; cursor:pointer; display:flex; flex-direction:column; gap:8px; align-items:center;}
.mode-card span:first-child{font-size:1.8rem;}
.mode-card.active{border-color:var(--accent); background:var(--panel2);}

.opt-label{font-weight:600; margin:16px 0 8px; font-size:.88rem; color:var(--muted);}
.pill-row{display:flex; flex-wrap:wrap; gap:8px;}
.pill{padding:9px 14px; border-radius:999px; border:1px solid var(--border); background:var(--panel); cursor:pointer; font-size:.86rem; font-weight:600;}
.pill.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.text-input{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--panel); font-size:.95rem;}
.danger-btn{width:100%; margin-top:22px; padding:13px; border-radius:12px; border:1px solid var(--bad); background:transparent; color:var(--bad); font-weight:600; cursor:pointer;}

.game-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.icon-btn{width:34px; height:34px; border-radius:10px; border:1px solid var(--border); background:var(--panel); cursor:pointer; font-size:.95rem;}
.status{font-weight:700; font-size:.95rem;}
#friend-id{font-size:1.8rem; font-weight:800; letter-spacing:.25em; text-align:center; padding:12px; border-radius:14px; background:var(--panel2); margin:8px 0 10px;}
.row2{display:flex; gap:8px; margin-bottom:10px;} .row2 .text-input{flex:1;}
.lb-row{display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:8px; border-radius:12px; border:1px solid var(--border); background:var(--panel);}
.lb-row.me{border-color:var(--accent); background:var(--panel2);}
.lb-rank{width:30px; font-weight:800; text-align:center; flex:none;}
.lb-name{flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lb-name small{display:block; color:var(--muted); font-weight:500; font-size:.75rem;}
.lb-rating{font-weight:800;}
.lb-btn{padding:7px 10px; border-radius:10px; border:1px solid var(--border); background:var(--panel2); cursor:pointer; font-size:.8rem; font-weight:700;}
.lb-note{color:var(--muted); font-size:.85rem; margin:10px 2px; line-height:1.4;}
.tabs2{display:flex; gap:8px; margin-bottom:14px;} .tabs2 button{flex:1; padding:10px; border-radius:12px; border:1px solid var(--border); background:var(--panel); font-weight:700; cursor:pointer;} .tabs2 button.active{background:var(--accent); color:var(--accent-ink);}
#learn-board{display:grid; grid-template-columns:repeat(8,1fr); grid-auto-rows:1fr; width:min(94vw,420px); aspect-ratio:1; margin:0 auto; border-radius:10px; overflow:hidden; border:1px solid var(--border);}
#learn-board .sq{cursor:default;}
.lesson-item{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px; margin-bottom:10px; border-radius:14px; border:1px solid var(--border); background:var(--panel); cursor:pointer; font-size:1rem; font-weight:600;}
.lesson-item .num{width:32px; height:32px; border-radius:50%; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-weight:800; flex:none;}
.lesson-item.done .num{background:var(--accent); color:var(--accent-ink);}
.lesson-item small{display:block; color:var(--muted); font-weight:500; font-size:.8rem; margin-top:2px;}
.lesson-text{margin:16px 2px; line-height:1.55; font-size:.98rem;}
.lesson-nav{display:flex; gap:10px;} .lesson-nav button{flex:1;}
#board{display:grid; grid-template-columns:repeat(8,1fr); grid-auto-rows:1fr; width:min(94vw,420px); aspect-ratio:1; margin:0 auto; border-radius:10px; overflow:hidden; border:1px solid var(--border);}
.sq{display:flex; align-items:center; justify-content:center; font-size:min(8.6vw,38px); line-height:1; position:relative; cursor:pointer; user-select:none; touch-action:manipulation; overflow:hidden;}
.light{background:var(--light-sq);}
.dark{background:var(--dark-sq);}
.sel{box-shadow:inset 0 0 0 3px var(--accent);}
.king-check{box-shadow:inset 0 0 0 3px var(--bad);}
.target::after{content:''; position:absolute; width:26%; height:26%; border-radius:50%; background:rgba(0,0,0,.28); pointer-events:none;}
.cap-target{box-shadow:inset 0 0 0 3px var(--bad);}
.pcs{display:block; width:100%; height:100%; pointer-events:none; filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.35));}
.sq .pcs{width:90%; height:90%;}
.cap-icon{display:inline-block; width:1.15em; height:1.15em; vertical-align:middle;}
.pc-w{color:#f7f1de; text-shadow:0 0 1.5px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.6); -webkit-text-stroke:.5px rgba(0,0,0,.6);}
.pc-b{color:#181209; text-shadow:0 0 1.5px rgba(255,255,255,.55);}
.captured{min-height:26px; text-align:center; font-size:1rem; letter-spacing:2px; color:var(--muted);}
.game-actions{display:flex; gap:10px; margin-top:16px;}
.game-actions button{flex:1; padding:13px; border-radius:12px; border:1px solid var(--border); background:var(--panel); font-weight:600; cursor:pointer;}

.big-rating{font-size:2.4rem; font-weight:800; text-align:center; margin-bottom:6px;}
.wld-row{display:flex; justify-content:space-around; text-align:center; margin:14px 0 6px;}
.wld-row span{display:block; font-size:1.25rem; font-weight:800;}
.wld-row label{font-size:.75rem; color:var(--muted);}
.xp-bar{height:10px; border-radius:6px; background:var(--panel2); overflow:hidden; border:1px solid var(--border);}
.xp-fill{height:100%; background:var(--accent); width:0%;}

.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex;
  background:var(--panel); border-top:1px solid var(--border);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
}
.navbtn{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; font-size:.68rem; color:var(--muted); cursor:pointer;}
.navbtn span:first-child{font-size:1.25rem;}
.navbtn.active{color:var(--accent);}

.player-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0;}
.player-row .captured{flex:1; text-align:left;}
.clock{min-width:74px; text-align:center; padding:6px 12px; border-radius:10px; background:var(--panel2); font-weight:800; font-size:1.15rem; font-variant-numeric:tabular-nums; border:1px solid var(--border);}
.clock.active{background:var(--accent); color:var(--accent-ink);}
.clock.low{color:#e5484d;} .clock.active.low{background:#e5484d; color:#fff;}
.spinner{width:42px; height:42px; margin:0 auto 16px; border-radius:50%; border:4px solid var(--border); border-top-color:var(--accent); animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#search-text{white-space:pre-line;}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:20; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:26px 20px; max-width:340px; width:100%; text-align:center;}
.modal p{font-weight:700; font-size:1.1rem; margin:0 0 18px;}
.modal-actions{display:flex; gap:10px;}
.modal-actions button{flex:1; padding:12px; border-radius:12px; border:none; font-weight:700; cursor:pointer;}
#modal-again{background:var(--accent); color:var(--accent-ink);}
#modal-home{background:var(--panel2); color:var(--text); border:1px solid var(--border) !important;}

#app{max-width:480px;padding:0 0 110px}
.view{padding:14px 16px}
#view-home{padding:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#0a0e13;border-bottom:1px solid var(--border);position:static}
.tb-user{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.tb-avatar{width:42px;height:42px;border-radius:50%;border:2px solid #4cd964;background:#1a212a;display:grid;place-items:center;flex:none}
.tb-avatar svg{width:24px;height:24px;fill:#aab4bf}
.tb-name{font-weight:600;font-size:.86rem;display:flex;align-items:center;gap:5px;white-space:nowrap}
#home-name{overflow:hidden;text-overflow:ellipsis;max-width:92px}
.dot{width:7px;height:7px;border-radius:50%;background:#33d449;flex:none}
.tb-lvl{display:flex;align-items:center;gap:5px;font-size:.75rem;margin-top:2px}
.tb-lvl b{border:1px solid #3a4550;border-radius:5px;padding:0 6px;font-weight:600}
.crown{color:#f0b429}
.tb-streak{text-align:center;line-height:1.05;border-left:1px solid var(--border);padding-left:8px;font-size:.58rem;color:var(--muted)}
.tb-streak strong{display:block;font-size:1.5rem;color:#33d449;font-weight:700}
.tb-rate{display:flex;gap:8px;border-left:1px solid var(--border);padding-left:8px}
.tb-rate div{text-align:center;font-size:.58rem;color:var(--muted);line-height:1.35}
.tb-rate i{display:block;font-style:normal;font-size:.9rem;color:#aab4bf}
.tb-rate b{display:block;color:var(--text);font-weight:500;font-size:.7rem}
.hero{position:relative;display:block;margin:0;height:330px;overflow:hidden;background:radial-gradient(60% 55% at 50% 48%,rgba(40,150,170,.45),transparent 70%),linear-gradient(115deg,rgba(30,160,60,.55),transparent 38%),linear-gradient(245deg,rgba(30,160,60,.45),transparent 35%),#070b10}
.hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,var(--bg));z-index:4}
.hero-small{position:absolute;top:8px;left:0;right:0;text-align:center;color:#33414f;font-weight:700;font-size:1.05rem;z-index:2}
.hero-logo{position:absolute;top:36px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:8px;font-weight:800;font-size:min(12vw,3.3rem);letter-spacing:-1px;line-height:1;z-index:3}
.hero-logo .kn{color:#33d449;font-size:1.15em}
.hero-logo em{font-style:normal;color:#33d449}
.king{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);height:80%;z-index:2}
.side{position:absolute;color:#080b0f;z-index:1;filter:blur(.6px);text-shadow:0 0 14px rgba(70,170,130,.45);line-height:1}
.floor{position:absolute;left:-10%;right:-10%;bottom:-30px;height:130px;background:repeating-conic-gradient(#1a222b 0 25%,#0a0e13 0 50%) 0 0/60px 60px;transform:perspective(200px) rotateX(55deg);opacity:.55}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 0}
.card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:14px 12px;border-radius:14px;background:#0f151c;border:1px solid #1e2833;color:var(--text);text-align:left;cursor:pointer;min-height:76px}
.card.big{grid-template-columns:1fr auto;min-height:112px;row-gap:6px}
.card.big .ci{grid-column:1;grid-row:1;align-self:end}
.card.big .ct{grid-column:1;grid-row:2;align-self:start}
.card.big .ca{grid-column:2;grid-row:1/3}
.card.green{border-color:#2aa84a;background:linear-gradient(#0d1a12,#0b1410)}
.ci svg{width:34px;height:34px;display:block;fill:currentColor}
.ct b{display:block;font-size:1.15rem;font-weight:600}
.ct small{color:var(--muted);font-size:.78rem}
.ca{color:#8b97a3;font-size:1.7rem;line-height:1}
.explore{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px;min-height:68px;border-radius:14px;border:1px solid #1e2833;color:var(--text);cursor:pointer;text-align:left;background:linear-gradient(90deg,#0d1218 45%,rgba(20,70,70,.45)),repeating-conic-gradient(#1a222b 0 25%,#0a0e13 0 50%) 0 0/34px 34px}
.explore .kn{color:#33d449;font-size:2rem}
.explore b{display:block;font-weight:500;font-size:1rem}
.explore b.g{color:#33d449}
.explore .go{margin-left:auto;width:42px;height:42px;border-radius:50%;background:#252d37;display:grid;place-items:center;font-size:1.3rem}
.bottomnav{background:#0a0e13;border-top:1px solid #1a222b}
.navbtn{position:relative;font-size:.92rem;padding:10px 2px 9px}
.navbtn svg{width:30px;height:30px;fill:currentColor}
.navbtn.active{color:#33d449}
.navbtn.active::after{content:'';position:absolute;bottom:-2px;left:22%;right:22%;height:3px;border-radius:2px;background:#33d449}
.more-list{display:flex;flex-direction:column;gap:8px}
.more-list button{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--panel);font-size:1rem;text-align:left;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1c2630;border:1px solid var(--border);padding:10px 16px;border-radius:999px;font-size:.85rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* Chessii Puzzles */
.puzzle-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.puzzle-title{font-size:1.35rem;font-weight:800}
.puzzle-meta{color:var(--muted);font-size:.78rem}
.puzzle-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.puzzle-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.puzzle-dots{display:flex;gap:5px}
.puzzle-dot{width:8px;height:8px;border-radius:50%;background:#39434d}
.puzzle-dot.done{background:var(--good)}
.puzzle-dot.current{background:var(--accent);box-shadow:0 0 0 3px rgba(51,204,77,.14)}
#puzzle-board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));width:100%;max-width:420px;aspect-ratio:1;margin:0 auto;border-radius:10px;overflow:hidden;border:1px solid var(--border);min-width:0;box-sizing:border-box}
.psq{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;width:100%;height:100%;font-size:clamp(24px,8vw,38px);line-height:1;position:relative;cursor:pointer;user-select:none;touch-action:manipulation;overflow:hidden;box-sizing:border-box;font-family:'DejaVu Sans','Noto Sans',Arial,sans-serif}
.psq.light{background:var(--light-sq)} .psq.dark{background:var(--dark-sq)}
.psq.pselected{box-shadow:inset 0 0 0 3px var(--accent)}
.psq.ptarget::after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:rgba(0,0,0,.28)}
.psq.pwrong{animation:pwrong .25s linear 2}
@keyframes pwrong{50%{box-shadow:inset 0 0 0 4px var(--bad)}}
.puzzle-status{text-align:center;font-weight:700;min-height:28px;margin:12px 0 4px}
.puzzle-status.good{color:var(--good)} .puzzle-status.bad{color:var(--bad)}
.puzzle-info{text-align:center;color:var(--muted);font-size:.82rem;min-height:22px}
.puzzle-actions{display:flex;gap:8px;margin-top:12px}
.puzzle-actions button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--border);background:var(--panel2);font-weight:700;cursor:pointer}
.puzzle-actions .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.puzzle-progress{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:8px 0 14px}
.puzzle-progress>div{height:100%;background:var(--accent);width:0%;transition:width .25s}
.puzzle-back{margin-bottom:10px}
</style>
</head>
